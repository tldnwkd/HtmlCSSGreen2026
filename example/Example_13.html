<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .menu{
            width: 400px;
            padding: 20px;
            background-color: rgb(245, 236, 215);
            border-radius: 10px;
            border: 1px solid #ccc;
        }
        h1{
            text-align: center;
            letter-spacing: 2px;
            font-size: 25px;
            margin-bottom: 20px;
        }
        span{
            float: right;
        }
        ul li{
            border-bottom: 1px dashed rgb(163, 156, 156);
            margin-bottom: 10px;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="menu">
    <h1>Café Menu</h1>
        <ul>
            <li>
                AMERICANO <span>$3.50</span>
            </li>
            <li>
                LATTE <span>$4.00</span>
            </li>
            <li>
                CAPPUCCINO <span>$4.20</span>
            </li>
        </ul>
    </div>
</body>
</html>
