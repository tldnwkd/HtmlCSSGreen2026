<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문조사</title>
    <style>
        body{
            font-family: sans-serif;
            font-size: 14px;
        }
        h3{
            margin-bottom: 20px;
        }
        ul{
            /* li의 기호삭제 CSS */
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
        ul li{
            margin-bottom: 10px;
        }
        textarea{
            width: 300px;
            height: 80px;
            margin-top: 5px;
        }
        label{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h3>간단한 설문</h3>
    <form>
    <ul>
        <li>
        <label for="fruit">좋아하는 과일 선택:</label>
        <select name="fruit" id="fruit">
            <option value="사과" selected>사과</option>
            <option value="바나나">바나나</option>
            <option value="딸기">딸기</option>
            <option value="포도">포도</option>
        </select>
        </li>
        <li>
            <!-- 좋아하는 음료: dataist이용
                -select 태그와 다른점은 사용자가 직접 입력할 수 있다.
                -키보드로 입력하면 해당 글자가 들어간 항목만 필터링 된다.
                -input 태그에 추천 옵션을 제공방식으로 작성한다.
                -<input list="ID"><datalist id="ID" 
            -->
            <label for="drink">좋아하는 음료입력:</label>
            <input type="text" id="drink" name="drink" list="drink-list">
            <datalist id="drink-list">
                <option value="콜라">콜라</option>
                <option value="사이다">사이다</option>
                <option value="쥬스">쥬스</option>
                <option value="커피">커피</option>
            </datalist>
            
        </li>
        <li>
                <label for="hobby">취미(복수 선택 가능):</label>
                <input type="checkbox" name="hobby" value="독서"/>독서
                <input type="checkbox" name="hobby" value="운동"/>운동
                <input type="checkbox" name="hobby" value="음악"/>음악
                <input type="checkbox" name="hobby" value="여행"/>여행
                
        </li>
        <li>
                <label for="gender">성별선택:</label>
                <input type="radio" name="gender">남성
                <input type="radio" name="gender">여성   
        </li>
        <li>
            <label for="content">추가의견:</label><br/>
            <textarea id="content" name="comment" placeholder="의견을 입력하세요"></textarea>
        </li>
    </ul>
    </form>

   
</body>
</html>
