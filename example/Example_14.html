<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품카드</title>
    <style>
        body{
            width: 800px;
            box-sizing: border-box;
            border: 1px solid black;
            display: flex;
            justify-self: left;
            text-align: center;
            background-color: rgb(238, 238, 238);
            margin: 30px;
            padding: 30px 40px;
        }
        div{
            width: 200px;
            box-sizing: border-box;
            border: 0 solid rgb(0, 0, 0);
            margin: 0 15px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 2px 6px 6px rgba(0, 0, 0, 0.2);
        }
        div img{
            width:100%;
            border-radius: 10px;
        }
        p{
            font-size: 12.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 10px;
            color: grey;
            margin: 0 0 12px 0;
        }
        h2{
            font-size: 100%;
            font-size: 18px;
            margin: 0 0 5px 0;
            padding: 0;
            text-transform: capitalize;
            
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/product1.jpg" alt="상품1 이미지">
    <h2>wireless earbuds</h2>
    <p>
        This is a long product 
        description text that will be truncated
    </p>
    </div>
    
    <div class="card">
        <img src="/images/product2.jpg" alt="상품2 이미지">
        <h2>smart watch</h2>
    <p>
        Track your health and fitness goals 
        easily every single day
    </p>
    </div>
    
    <div class="card">
        <img src="/images/product3.jpg" alt="상품3 이미지">
    <h2>bluetooth speaker</h2>
    <p>
        Portable speaker with powerful 
        sound and long battery life
    </p>
    </div>
    
</body>
</html>
