<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 로그인</title>
    <link rel="stylesheet" href="/styleCSS/style_login.css">
</head>
<body>
    <div class="login-wrap">
        <h1>NAVER</h1>
        <div class="login-box">
            <div>
                <div>
                    <label for="id">
                        <input type="text" name="id" id="id" placeholder="아이디 또는 전화번호">
                    </label>
                </div>
                <div>
                    <label for="pw">
                        <input type="password" name="pw" id="pw" placeholder="비밀번호">
                    </label>
                </div>
                <div class="ip-wrap">
                    <label for="check">
                        <input type="checkbox" name="check" id="check">로그인 상태 유지
                    </label>
                    <div class="ip">IP보안</div>
                </div>
                
                <div>
                    <button type="submit" class="pass-login">
                        패스키 로그인
                    </button>   
                    <button type="submit" class="login">
                        로그인
                    </button>   
                </div>
                <div class="QR">
                    <a href="">QR코드 로그인</a> <span>|</span>
                    <a href="">일회용 번호 로그인</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
