<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            list-style: none;
            background-color: #f2f3f2;;
        }
        .container{
            display: flex;
            width: 1050px;
            justify-content: space-evenly;
            margin: 20px auto;
        }
        .product{
            width: 23%;
        }
        img{
            width: 100%;
            border-radius: 5px;
            box-shadow: 0 0 0.2px 0.2px rgba(252, 252, 252, 0.5);
        }
        .name{
            font-size: 13.5px;
            font-weight: 500;
        }
        .price{
            text-decoration: line-through;
            opacity: 0.5;
            font-size: 15px;
        }
        .sale-price{
            font-weight: bold;
        }
        .sale{
            color: red;
        }
        .love-container{
            position: relative;
        }
        .love{
            position: absolute;
            right: 5px;
            bottom: 12px;
            border: 1px solid gray;
            border-radius: 50%;
            padding: 0 3px;
            background-color: rgb(7, 7, 7);
            color: rgb(212, 211, 211);
            opacity: 0.4;
            font-size: 14px;
        }
    </style>
</head>

    <div class="container">
