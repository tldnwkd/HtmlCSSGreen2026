<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .card-container{
            width: 1000px;
            display: flex;
            height: 100px;
        }
        .card{
            border: 1px solid white;
            border-radius: 8px;
            background-color: dodgerblue;
            color: white;
            flex: 1;
            text-align: center;
            margin: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }
        p{
            font-size: 12px;
        }
        h3{
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h3>Card 1</h3>
            <p>첫 번째 카드 설명입니다.</p>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>두 번째 카드 설명입니다.</p>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>세 번째 카드 설명입니다.</p>
        </div>
    </div>
</body>
</html>
