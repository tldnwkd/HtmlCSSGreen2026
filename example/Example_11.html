<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coffee</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            font-family: sans-serif;
        }
        h1{
            border-radius: 20px;
            width: 790px;
            border: 1px solid black;
            box-sizing: border-box;
            background-color: black;
            color: white;
            padding: 12px 50px;
            box-shadow: 8px 8px 8px rgba(0, 0, 0, 0.5);
            text-align: center;
            font-size: 35px;
            margin: 20px;       
        }
        span{
            color: blue;
            font-weight: bold;
            text-decoration: underline;
            font-size: 20px;
        }
        ul li{
            font-size: 20px;
            list-style: none;
            margin-left: 35px;
        }

    </style>
</head>
<body>
    <h1>Best Coffee Beans of the World</h1>
    <ul>
        <li>
            <span>Ethiopia Yirgacheffe</span>
            : Known for its bright acidity and floral,citrus notes.
        </li>
        <li>
            <span>Colombia Supremo</span>
            : Balanced flavor with a nutty,caramel sweetness.
        </li>
        <li>
            <span>Guatemala Antigua</span>
            : Rich body with smoky, chocolate undertones.
        </li>
    </ul>
</body>
</html>
