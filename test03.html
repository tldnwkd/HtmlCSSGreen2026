<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표만들기</title>
</head>
<body>
    <!-- 아래는 테이블 구조
        <table>
            <thead>
                머리글,필드명
                <th></th>
            </thead>
            <tbody>
                데이터,자료
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>   
                </tr>
            </tbody>
            <tfoot>
                총계,총개수,평균통계값
                <tr>
                    <td></td>
                    <td></td>

                </tr>
            </tfoot>           
        </table> 
     -->
    <table border="1">
        <caption>표 연습</caption>
            <tr>
                <td>1st cel</td>
                <td>2st cel</td>
            </tr>
            <tr>
                <td>3st cel</td>
                <td>4st cel</td>
            </tr>
    </table>
    <hr>
<!-- 표 2번째 -->
    <table border="1">
        <caption>국내에서 사용하는 브라우저</caption>
            <th>브라우저</th>
            <th>제조업체</th>
            <th>다운로드</th>
            <tr>
                <td>크롬</td>
                <td>google</td>
                <td>https://www.google.com</td>
            </tr>
            <tr>
                <td>파이어폭스</td>
                <td>Mozilla</td>
                <td>https://www.Mozilla.com</td>
            </tr>
            <tr>
                <td>엣지</td>
                <td>Microsoft</td>
                <td>https://www.Microsoft.com</td>
            </tr>
    </table>
</body>
</html>
