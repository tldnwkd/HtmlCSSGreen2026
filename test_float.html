<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float 가로배치 하기</title>
    <style>
        .parent{
            border: 5px solid red;
            width: 600px;
            /* height: 200px; */
            /* 
                overflow: hidden을 지정하면 부모 높이보다
                자식의 높이가 넘쳐 화면에 숨기고 싶을떄
            */
            /* overflow: hidden; */
            font-size: 10px;
            margin: 0 auto;
            text-align: center;
        }
        .child{
            font-size: inherit; /* 부모의 글꼴 크기를 상속받는 CSS */
            background-color: gold;
            width: 200px;
            height: 300px;
            /* 
            자식에 float을 지정하면 부모는 자식이 없다고 여겨서
            높이 값을 잃는다는 점을 주의하자!
             */
            /* float:left; */
            display: inline-block;
            /* block 요소에만 margin:auto를 사용할 수 있다.*/
            /* margin: 0 auto; */
        }
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .parent02{
            border: 3px solid blue;
            width: 606px;
        }
        .top{
            background-color: blueviolet;
            height: 50px;
        }
        .left{
            background-color: skyblue;
            height: 50px;
            width: 200px;
            float: left;
        }
        .right{
            background-color: brown;
            height: 50px;
            width: 400px;
            float: right;
        }
        .clear{
            background-color: dodgerblue;
            height: 50px;
            /* 
            clear는 float를 지정하지 않았지만 위의 태그에
            float를 지정한 경우 자동으로 상속받는다.
            따라서,위의 태그의 float을 해제해야한다.
            해제방법 clear:both;
            */
            clear: both;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">child</div>
    </div>
    <hr/>
    <div class="parent02">
        <div class="top">float:none</div>
        <div class="left">float:left</div>
        <div class="right">float:right</div>
        <div class="clear">float:clear</div>
    </div>
</body>
</html>
