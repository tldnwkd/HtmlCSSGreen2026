<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="/OOZY/login.css">
</head>
<body>
    <section class="container">
        <h1>OOZY COFFEE</h1>
        <form action="">
            <ul class="login-info">
                <li>
                    <!-- 아이디 입력 -->
                    <label>
                        <input type="text" name="name" placeholder="아이디를 입력해 주세요.">
                    </label>
                </li>
                <li>
                    <!-- 비밀번호 입력 -->
                    <label>
                        <input type="password" name="password" placeholder="비밀번호를 입력해 주세요.">
                    </label>
                </li>
                <li>
                    <!-- 로그인 버튼 -->
                    <label><button type="submit"><a href="#">로그인</a></button></label>
                </li>
            </ul>
        </form>
            <ul class="login-find">
                <li>
                    <!-- 로그인 상태  -->
                    <label for="login-hold">
                    <input type="checkbox" id="login-hold" name="login">로그인 상태 유지</label>
                </li>
                <li>
                    <!-- 아이디 - 비밀번호 찾기 -->
                    <a href="#">아이디</a>·<a href="#">비밀번호 찾기</a> 
                 </li>
            </ul>
            <div class="sns-container">
                <h2 class="sns-child">SNS 간편 로그인</h2>
                <ul class="sns">                 
                    <li class="naver">
                        <a href="https://www.naver.com"><img src="/OOZY/images/sns_naver.svg" alt="네이버" /></a>                                                   
                    </li>
                    <li class="kakao">
                        <a href="https://www.naver.com"><img  src="/OOZY/images/sns_kakao.svg" alt="카카오" /></a>                  
                    </li>
                    <li class="facebook">
                         <a href="https://www.naver.com"><img  src="/OOZY/images/sns_facebook.svg" alt="페이스북" /></a> 
                    </li>
                    <li class="google">
                        <a href="https://www.naver.com"><img  src="/OOZY/images/sns_google.svg" alt="구글" /></a>
                    </li>
                    <li class="apple">
                        <a href="https://www.naver.com"><img  src="/OOZY/images/sns_apple.svg" alt="애플" /></a>
                    </li>
                </ul>
            </div>
            <button type="button"><a href="member.html">회원가입</a></button>
            <div class="coupon">
                회원가입 하면
                <span>10만원 쿠폰팩</span>
                을 드려요!
            </div>  
    </section>
</body>
</html>
