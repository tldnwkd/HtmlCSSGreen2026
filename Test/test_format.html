<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서식</title>
    <style>
        /* 
            1. px: 고정단위 (반응형/접근성에 불리함)
            2. em: 부모 기준의 상대단위
            3. rem: 최상위(html) 기준 상대 단위(현대 반응형 웹 표준 단위)
        */
        html{
            font-size: 15px;
        }
        body{
            font-size: 16px;
            font-family: sans-serif;
            /* line-height 줄과 줄 사이 간격 */
            /*
               line-heigh를 24px와 같이 고정단위를 지정하면
               font-size를 변경해도 줄 간격이 고저된다.
               글자 크기가 변경됨에 따라 맞춰서 줄 간격도 변경되게 하려면
               자동단 rem(최상위((html)) 또는 em(상위(기본은 body))
             */
            line-height:2rem;
            color: #333;
        }
        h3{
            font-size: 1.5rem; /* 1.5rem = html(최상위) px수치*1.5=24px */
            font-weight: 700;
            color: #111;
            text-decoration: underline;
        }
        a{
            /* a태그의 하이퍼링크(밑줄) 스타일 삭제 */
            text-decoration: none;
        }
        p.text{
            /* 기울임꼴 CSS */
            font-style: italic;
            /* 자동 줄 바꿈 CSS: normal = 자동줄바꿈 함 */
            /* 자동 줄 바꿈 CSS: nowrap = 자동줄바꿈 안함 */
            white-space: nowrap;
            /* 자동 줄 바꿈이 되지 않은 상태에서 가려진 text를 감추는 CSS */
            overflow: hidden;
            /* 넘친 text 부분을 ....으로 감출때 사용하는 CSS */
            /* clip(기본값) */
            /* ellipsis : ... 표시 */
            text-overflow: ellipsis;
        }
        p.copy{
            /* 첫 글자만 대문자로 CSS :단어별(띄어쓰기 구분) 대문자로 수정 CSS*/
            text-transform: capitalize;
            /* 알파벳 글자 간격 조정 CSS */
            letter-spacing: 1px;
            /* 단어(띄어쓰기) 간격 조정 CSS */
            word-spacing: 2px;

        }
    </style>
</head>
<body>
    <h3>CSS 서식관련 속성</h3>
    <a href="">네이버</a>
    <p class="text">
        든 창공에 너의 쓸쓸한 이것이다. 자고 가는 속에 기쁘며, 칼이다
        트고, 보는 들어 만물은 있다. 찾아다녀도, 따뜻함 품고 그것은 무엇이 그들의
        굳세게 아니더면, 뜨고, 뿐이다. 작고 구할 붙잡아 쓸쓸하라? 것은 불러 얼마나 위하여
        석가는 있으랴?
    </p>
    <p class="copy">copyright all resered by hangul 2026</p>
</body>
</html>
