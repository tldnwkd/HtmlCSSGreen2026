<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 마켓컬리</title>
  <link rel="stylesheet" href="kurl_join.css">
</head>
<body>
  <h4>회원가입</h4>
  <div><span>*</span>필수입력사항</div>
  <hr>

  <form name="join">
    <ul>
      <li>
        <label for="id" class="margin">아이디<span>*</span></label>
        <input type="text" name="id" id="id" placeholder="아이디를 입력해주세요" required>
      </li>
      <li>
        <label for="pw" class="margin">비밀번호<span>*</span></label>
        <input type="password" name="pw" id="pw" placeholder="비밀번호를 입력해주세요" required>
      </li>
      <li>
        <label for="pw2" class="margin">비밀번호확인<span>*</span></label>
        <input type="password" name="pw2" id="pw2" placeholder="비밀번호를 한번 더 입력해주세요" required>
      </li>
      <li>
        <label for="name" class="margin">이름<span>*</span></label>
        <input type="text" name="name" id="name" placeholder="이름을 입력해주세요" required>
      </li>
      <li>
        <label for="mail" class="margin">이메일<span>*</span></label>
        <input type="text" name="mail" id="mail" placeholder="예: marketkurly" required>
        @
        <select name="select_mail">
          <option value="naver">naver.com</option>
          <option value="gmail">gmail.com</option>
          <option value="daum">daum.net</option>
          <option value="nate">nate.com</option>
          <option value="direct" selected disabled>직접입력</option>
        </select>
      </li>
      <li>
        <label for="phone" class="margin">휴대폰<span>*</span></label>
        <input type="tel" name="phone" id="phone" placeholder="숫자만 입력해주세요" required>
        <button type="button" class="phone_button" disabled>인증번호 받기</button>
      </li>
      <li>
        <span>주소<label><span>*</span></label></span>
        <div>
          <button type="button" class="address_button">
            <img src="https://res.kurly.com/pc/service/cart/2007/ico_search.svg" alt="검색" width="20px" height="20px">
            주소 검색
          </button><br>  
          <span class="info">배송지에 따라 상품 정보가 달라질 수 있습니다.</span>        
        </div>
      </li>
      <li>
        <span>성별</span>
        <label ><input type="radio" name="gender" value="m" >남자</label>
        <label ><input type="radio" name="gender" value="w" >여자</label>
        <label ><input type="radio" name="gender" value="none" checked >선택안함</label>
      </li>
      <li>
        <span>생년월일</span>
        <div>
          <input type="text" name="yeal" id="yeal" placeholder="YYYY"> /
          <input type="text" name="month" id="month" placeholder="MM"> /
          <input type="text" name="day" id="day" placeholder="DD">
        </div>
      </li>
      <li>
        <span>추가입력 사항</span>
        <label><input type="radio" name="add" value="friend">친구 초대 추천인 아이디</label>
      </li>
    </ul>

    <hr>

    <div>이용약관동의<span>*</span></div>
  <ul class="agree-list">
      <li>
        <label><input type="checkbox" name="agree_all">전체 동의합니다.</label>
      </li>
      <div class="last">선택항목에 동의하지 않은 경우도 회원가입 및 일반 서비스를 이용할 수 있습니다.</div>
      <li>
        <label><input type="checkbox" name="agree_terms">이용약관 동의</label>
        <span class="agree">(필수)</span>
      </li>
      <li>
        <label><input type="checkbox" name="agree_privacy">개인정보 수집·이용 동의</label>
        <span class="agree">(필수)</span>
      </li>
      <li>
        <label><input type="checkbox" name="agree_sms">개인정보 수집·이용 동의</label>
        <span class="agree">(선택)</span>
      </li>
      <li>
        <label><input type="checkbox" name="agree_event">이벤트 및 혜택정보 발송을 위한 수집·이용</label>
        <span class="agree">(선택)</span>
      </li>
      <li>
        <label><input type="checkbox" name="agree_age">본인은 만 14세 이상입니다.</label>
        <span class="agree">(필수)</span>
      </li>
    </ul>

    <div class="submit-btn">
      <button type="submit">가입하기</button>
    </div>
  </form>
  
</body>
</html>
