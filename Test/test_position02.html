<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixed 포지션</title>
    <style>
        .parent{
            background-color: dodgerblue;
            width: 800px;
            height: 300px;
            position: relative;
        }
        .child{
            background-color: crimson;
            width: 200px;
            height: 100px;
            position: absolute;
            right: 300px;
            bottom: 100px;
        }
        .parent02{
            border: 1px solid red;
            width: 600px;
            height: 300px;
            margin: 0 auto;
            position: relative;
        }
        /* 공통 box */
        .box{
            width: 100px;
            height: 100px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            border: 1px solid blue;
            display: inline-block;
            position: absolute;
        }
        /* position이 존재하지 않는 경우
        top,left,rifht,bottom은 사용 못함
         */
        .inline-top-left{
            background-color: orange;
            top: 0;
            left: 0;        
        }
        .inline-top-right{
            background-color: orange;
            top: 0;
            right: 0;        
        }
        .inline-bottom-left{
            background-color: orange;
            bottom: 0;
            left: 0;        
        }
        .inline-bottom-right{
            background-color: orange;
            bottom: 0;
            right: 0;        
        }

        .child1{
            background-color: dodgerblue;
            top: 100%;
            left: 0; 
            font-size: 24px;       
        }
        .child2{
            background-color: dodgerblue;
            top: 0;
            left: 100%; 
            font-size: 24px;       
        }
        .child3{
            background-color: dodgerblue;
            top: 100%;
            left: 100%; 
            font-size: 24px;       
        }
        .inline-center{
            background-color: crimson;
            top:50%;
            left:50%;
            /* transform은 모양을 변경하는 속성
               translate(x축이동,y축이동) */
            transform: translate(-50%,-50%);
        }
        
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
        </div>
    </div>
    <hr/>

    <div class="parent02">
        <div class="box inline-top-left">top:0<br>left:0</div>
        <div class="box inline-top-right">top:0<br>right:0</div>
        <div class="box inline-bottom-left">bottom:0<br>left:0</div>
        <div class="box inline-bottom-right">bottom:0<br>right:0</div>
        <div class="box inline-center">center</div>

        <div class="box child1">1</div>
        <div class="box child2">2</div>
        <div class="box child3">3</div>
    </div>
</body>
</html>
