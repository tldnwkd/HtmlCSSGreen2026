<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        /* 부모인 container 공통 CSS display:flex */
        .container{
            /* 부모요소가 아니라 container안의 자식요소를 가로배치 한다. */
            display: flex;

            /*  row:가로배치
                culunm :세로 배치
            */
            flex-direction:row;
            /* 부모의 가로 너비가 자식요소 전체의 너비보다 작을때
                자동 개행속성을 지정한다.
                flex-wrap
            */
            flex-wrap: wrap;

            /* 자식요소를 부모요소의 가운대로 배치 */
            justify-content: center;

            /* 자기 자신을 가운대로 배치 */
            justify-self: center;

            /*  justify-content:between 
                요소와 요소사이의 공백을 최대한 벌림
            */
            justify-content: space-between;

            /* justify-content: space-evenly 
                자식요소들 사이 공백을 똑같이 지정(좌우 끝 포함)
            */
            justify-content: space-evenly;

            /* 상,하,좌,우 균등한 여백을 포함하여 정렬 
                따라서 자식요소 사이의 간격은 기본간격의 2배임
            */
            justify-content: space-around;

            width: 500px;
            border: 1px solid blue; 
        }
        /* 보통 인라인 요소는 너비,높이를 가질 수 없다.
           다만, display:flex를 지정하면 frlex 컨테이너가 되면서
           그 내부의 직계 자식요소들은 자동으로 블록 수준(Block-level)
           요소와 유사한 성격을 지닌다.
        */
        .container .box{
            background-color: crimson;
            width: 100px;
            height: 100px;
            border: 1px solid red;
            border-radius: 5px;
            margin: 5px;
            color: white;
        }
    </style>
</head>
<body>
    <!-- display:flex는 반드시 부모 flex 속성을 지정해야한다 -->
    <div class="container">
        <div class="box">div1</div>
        <div class="box">div2</div>
        <div class="box">div3</div>
        <div class="box">div4</div>
        <div class="box">div5</div>
        <div class="box">div6</div>
        <div class="box">div7</div>
        <div class="box">div8</div>
        <div class="box">div8</div>
        <div class="box">div8</div>
        <div class="box">div8</div>
        <div class="box">div8</div>
        <div class="box">div8</div>
        <div class="box">div8</div>
        <div class="box">div8</div>
        <div class="box">div8</div>
    </div>
   
</body>
</html>
