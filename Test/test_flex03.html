<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            width: 600px;
            border: 3px solid #333;
            height: 200px;
            background-color:white;
            margin: 20px auto;
        }
        .container .box{
            /* width: 100px;
            height: 100px;
            border: 1px solid black; */
            background-color: coral;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            color: white;
        }
        .container .box1{
            /* order(음수값 지정) 가장 앞으로 이동 */
            height: 100px;
            background-color: #e74c3c;
            /* 기본값이 0보다 작기 때문에 html의 순서와 상관없이
                맨 앞으로 감 */
            order: -1;
        }
        .container .box2{
            flex-grow: 2;
            height: 100px;
            background-color: dodgerblue;
        }
        .container .box3{
            /* flex-grow(남은여백을 1 비율만큼 차지하는 속성) */
            flex-grow: 1;
            height: 100px;
            background-color: blueviolet;
        }
        .container .box4{
            /* align-self(부모 정렬을 무시하고 혼자 맨 아래(오른쪽 아래 끝) 
            정렬하는 속성) */
            align-self: flex-end;
            height: 100px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box2">div2(grow:2)</div>
        <div class="box box3">div3(grow:1)</div>
        <div class="box box4">div4(self:end)</div>  
        <div class="box box1">div1(order:-1)</div>
    </div>
</body>
</html>
